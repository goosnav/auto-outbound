[project]
name = "auto-outbound"
version = "0.1.0"
description = "Evidence-led outbound preparation with your local AI agent."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pydantic==2.14.1",
  "python-multipart==0.0.32",
  "typer==0.27.3",
  "rich==15.0.0",
  "platformdirs==4.13.5",
  "dnspython==2.9.0",
  "openpyxl==3.1.5",
  "pypdf==6.21.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.17.2", "playwright==1.64.1"]

[tool.uv]
package = false
required-environments = [
  "sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
  "sys_platform == 'win32' and platform_machine == 'ARM64'",
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
