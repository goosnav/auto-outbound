<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Outbound — Starting</title>
<style>
  :root { color-scheme: light; font: 15px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff; color: #111; }
  main { width: min(34rem, calc(100% - 3rem)); padding: 2.5rem; background: #fff; border: 1px solid #111; border-top: 4px solid #111; }
  .brand { font-size: .75rem; font-weight: 700; color: #66675f; margin-bottom: 3rem; }
  h1 { margin: 0 0 .7rem; font-size: 2.5rem; letter-spacing: -.04em; }
  p { margin: .5rem 0; }
  progress { display: block; margin: 1.5rem 0; width: 100%; height: .35rem; accent-color: #1746c7; }
  #code { color: #b42318; font-weight: 700; }
  #log { color: #6b6b62; overflow-wrap: anywhere; font: .75rem/1.6 monospace; }
  button { display: none; margin-top: 1.25rem; border: 1px solid #20211e; padding: .65rem 1rem; font: inherit; font-weight: 600; cursor: pointer; background: #1746c7; color: #fff; }
  #copy { margin-left: .5rem; background: transparent; color: #20211e; }
  button:focus-visible { outline: 3px solid #1746c7; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { progress { animation: none; } }
</style>
<main>
  <div class="brand">GOOSNAV LABS / AUTO OUTBOUND</div>
  <h1 id="stage">Starting</h1>
  <p id="message" role="status" aria-live="polite">Prepare your lead lists and research reports.</p>
  <progress id="progress" aria-label="Application setup"></progress>
  <p id="code" role="alert"></p>
  <p id="log"></p>
  <button id="retry" type="button">Retry</button>
  <button id="copy" type="button">Copy details</button>
</main>
<script>
const stage = document.querySelector('#stage'), message = document.querySelector('#message');
const code = document.querySelector('#code'), log = document.querySelector('#log');
const retry = document.querySelector('#retry'), copy = document.querySelector('#copy');
const progress = document.querySelector('#progress');
let retryToken = '', diagnostics = '', disconnected = 0;
async function refresh() {
  try {
    const response = await fetch('/api/status', {cache: 'no-store'}), status = await response.json();
    disconnected = 0; progress.hidden = !status.in_progress;
    stage.textContent = status.stage; message.textContent = status.message; code.textContent = status.error_code || '';
    log.textContent = status.log_path ? `Log: ${status.log_path}` : '';
    retry.style.display = status.retryable ? 'inline-block' : 'none';
    copy.style.display = status.error_code ? 'inline-block' : 'none';
    retryToken = status.retry_token || '';
    diagnostics = [status.error_code, status.message, status.log_path].filter(Boolean).join('\n');
    if (status.ready_url) location.replace(status.ready_url);
  } catch (_) {
    if (++disconnected > 5) {
      progress.hidden = true;
      if (!code.textContent) {
        stage.textContent = 'Launcher closed';
        message.textContent = 'Open Auto Outbound again to continue.';
      }
    }
  }
}
retry.addEventListener('click', async () => {
  retry.disabled = true;
  await fetch('/api/retry', {method: 'POST', headers: {'X-Goosnav-Retry': retryToken}});
  retry.disabled = false;
});
copy.addEventListener('click', async () => { await navigator.clipboard.writeText(diagnostics); });
setInterval(refresh, 500); refresh();
</script>
</html>
